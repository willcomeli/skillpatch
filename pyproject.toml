[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpatch"
version = "0.1.0"
description = "Fresh benchmark execution and evidence for Skill patch research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skillpatch = "skillpatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
