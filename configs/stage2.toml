[stage2]
generation_config = "induction.toml"
evaluation_config = "patch-evaluation.toml"
# Explicitly add run-config paths for relevant prior-success tasks before a
# preservation experiment. Empty means no regression coverage, never no risk.
regression_configs = []
# Source task: this many fresh candidates compared with the same archived source
# execution. Regression tasks: this many fresh baseline/candidate pairs; baselines
# are reused across patch revisions within the same episode.
repetitions = 1
max_revisions = 2
# Overall time limit for each generation/evaluation session, including evidence reads.
model_session_timeout_sec = 900
# Generation gets its own deadline; evaluation keeps the 900-second limit above.
generation_session_timeout_sec = 1800
