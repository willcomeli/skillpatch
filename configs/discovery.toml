# Stage 1 uses a separate diagnosis model; this does not change the execution agent.
[diagnosis]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
prompt_path = "../prompts/discovery.md"
thinking = "disabled"
temperature = 0.0
max_tokens = 8192
timeout_sec = 240
# Character guard, not a provider token estimate. Oversize input fails without truncation.
max_input_chars = 600000

# Live diagnosis uses runtime.diagnosis_timeout_sec = 1800 in task configs.
# Turns, inspection calls and output corrections have no count ceilings.
# Per-request/context limits remain active; HTTP/transport failures are not retried.
time_budget_only = true
